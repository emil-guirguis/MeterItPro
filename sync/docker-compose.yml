# MeterItPro Sync — Docker Compose
#
# Works on Windows (Docker Desktop) and Linux.
# BACnet uses unicast reads to known IPs — works fine with bridge networking + published UDP port.
#
# Setup on a new machine:
#   1. Install Docker Desktop (Windows) or Docker Engine (Linux)
#   2. docker login ghcr.io -u <github-user> -p <ghcr-token>
#   3. Copy .env.docker to .env in this directory and fill in values
#   4. Place your schema dump at ./docker/init/00-schema.sql
#   5. docker compose up -d

services:

  # ── GHCR login (runs once on compose up, refreshes host Docker credentials) ──
  ghcr-login:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    command: sh -c "echo $$GITHUB_TOKEN | docker login ghcr.io -u $$GITHUB_USER --password-stdin"
    restart: "no"

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_SYNC_DB}
      POSTGRES_USER: ${POSTGRES_SYNC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SYNC_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d   # applied once on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SYNC_USER} -d ${POSTGRES_SYNC_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"   # never auto-update DB image

  # ── Sync API ────────────────────────────────────────────────────────────────
  sync-api:
    image: ghcr.io/${GITHUB_OWNER}/meteritpro-sync-api:latest
    ports:
      - "3002:3002"
    environment:
      POSTGRES_SYNC_HOST: db
      POSTGRES_SYNC_PORT: 5432
      POSTGRES_SYNC_DB: ${POSTGRES_SYNC_DB}
      POSTGRES_SYNC_USER: ${POSTGRES_SYNC_USER}
      POSTGRES_SYNC_PASSWORD: ${POSTGRES_SYNC_PASSWORD}
      POSTGRES_CLIENT_HOST: ${POSTGRES_CLIENT_HOST}
      POSTGRES_CLIENT_PORT: ${POSTGRES_CLIENT_PORT}
      POSTGRES_CLIENT_DB: ${POSTGRES_CLIENT_DB}
      POSTGRES_CLIENT_USER: ${POSTGRES_CLIENT_USER}
      POSTGRES_CLIENT_PASSWORD: ${POSTGRES_CLIENT_PASSWORD}
      MCP_HTTP_URL: http://sync-mcp:${MCP_HTTP_PORT:-3003}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_API_URL: ${CLIENT_API_URL}
    depends_on:
      db:
        condition: service_healthy
      sync-mcp:
        condition: service_started
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Sync Frontend (nginx) ───────────────────────────────────────────────────
  sync-frontend:
    image: ghcr.io/${GITHUB_OWNER}/meteritpro-sync-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - sync-api
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Sync MCP (BACnet meter reading) ────────────────────────────────────────
  # Uses unicast UDP reads to known meter IPs — works on bridge networking.
  sync-mcp:
    image: ghcr.io/${GITHUB_OWNER}/meteritpro-sync-mcp:latest
    ports:
      - "47808:47808/udp"    # BACnet UDP
    environment:
      POSTGRES_SYNC_HOST: db
      POSTGRES_SYNC_PORT: 5432
      POSTGRES_SYNC_DB: ${POSTGRES_SYNC_DB}
      POSTGRES_SYNC_USER: ${POSTGRES_SYNC_USER}
      POSTGRES_SYNC_PASSWORD: ${POSTGRES_SYNC_PASSWORD}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-3003}
      CLIENT_API_URL: ${CLIENT_API_URL}
      CLIENT_API_KEY: ${CLIENT_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      BACNET_DEBUG_POST_READ_CHECK: ${BACNET_DEBUG_POST_READ_CHECK:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Sync Provisioner (Cloudflare Tunnel auto-setup) ────────────────────────
  # Polls the client API for a tunnel token, then starts cloudflared.
  # Set SYNC_SERVER_ID and SYNC_SERVER_BOOTSTRAP_KEY in .env after adding
  # this server on the client site and clicking "Provision Tunnel".
  sync-provisioner:
    image: ghcr.io/${GITHUB_OWNER}/meteritpro-sync-provisioner:latest
    environment:
      CLIENT_API_URL: ${CLIENT_API_URL}
      SYNC_SERVER_ID: ${SYNC_SERVER_ID}
      SYNC_SERVER_BOOTSTRAP_KEY: ${SYNC_SERVER_BOOTSTRAP_KEY}
    depends_on:
      - sync-frontend
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Watchtower (auto-update labeled containers) ─────────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.45"
    command: --label-enable --cleanup --interval 300
    restart: unless-stopped
    depends_on:
      - ghcr-login
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  pgdata:
