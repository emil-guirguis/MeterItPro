name: Build and publish Docker images

on:
  push:
    branches: [main]
    paths:
      - 'sync/api/**'
      - 'sync/frontend/**'
      - 'sync/mcp/**'
      - 'framework/**'
      - 'version.json'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: meteritpro-sync-api
            context: sync/api
            file: sync/api/Dockerfile
          - name: meteritpro-sync-frontend
            context: sync/frontend
            file: sync/frontend/Dockerfile
          - name: meteritpro-sync-mcp
            context: .
            file: sync/mcp/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
          build-args: VITE_APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
