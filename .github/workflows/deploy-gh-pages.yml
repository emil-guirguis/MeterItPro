name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: MeterItPro/frontend/package-lock.json

      - name: Install Chrome for puppeteer (prerender)
        run: npx puppeteer browsers install chrome
        working-directory: ./MeterItPro/frontend
        continue-on-error: true

      - name: Install dependencies (frontend)
        run: npm ci
        working-directory: ./MeterItPro/frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./MeterItPro/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: MeterItPro/frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Smoke test GitHub Pages
        if: always()
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY##*/}
          url="https://${owner}.github.io/${repo}/"

          echo "Checking Pages URL: $url"

          success=0
          for i in {1..36}; do
            echo "Attempt $i: curling $url"
            if curl -fsSL --max-time 10 "$url" -o /dev/null; then
              echo "Site responded successfully"
              success=1
              break
            fi
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: GitHub Pages site did not become available at $url within the timeout"
            exit 1
          fi
