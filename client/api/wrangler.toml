name = "meteritpro-api"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
FRONTEND_URL = "https://meteritpro.com,http://localhost:5173,https://www.meteritpro.com"

# Database connection is configured via secrets:
# npx wrangler secret put DATABASE_URL
# npx wrangler secret put JWT_SECRET

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "48644504510e40829be6f314dacc1ef3"

{
  "observability": {
    "logs": {
      "enabled": true,
      "invocation_logs": true
    },
    "traces": {
      "enabled": false
    }
  }
}
